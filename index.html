<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡易記帳本</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js 圓餅圖套件 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body id="bodyBg" class="bg-gray-100 min-h-screen py-6 px-4 transition-colors duration-300">

    <div id="cardBg" class="max-w-md mx-auto bg-white rounded-2xl shadow-lg overflow-hidden transition-colors duration-300 text-gray-800 p-6">
        
        <!-- 頂部標題與黑白模式切換 -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold">💰 簡易記帳本</h1>
            <button id="themeToggleBtn" class="p-2 rounded-full transition text-sm">🌙</button>
        </div>

        <!-- ================= 頁面一：首頁 (Dashboard) ================= -->
        <div id="homeView">
            <!-- 餘額面板 -->
            <div id="balancePanel" class="bg-blue-50 border border-blue-100 rounded-xl p-4 text-center mb-6">
                <span id="balanceTitle" class="text-gray-500 text-sm block">總結餘</span>
                <h2 id="totalBalance" class="text-3xl font-bold my-1">$0</h2>
                <div class="flex justify-around mt-3 text-sm">
                    <div><span id="incomeLabel" class="text-gray-500">收入</span><span id="totalIncome" class="text-green-500 font-bold block">$0</span></div>
                    <div class="border-r border-gray-200"></div>
                    <div><span id="expenseLabel" class="text-gray-500">支出</span><span id="totalExpense" class="text-red-500 font-bold block">$0</span></div>
                </div>
            </div>

            <!-- 新增/修改表單 -->
            <form id="transactionForm" class="space-y-4 mb-6">
                <input type="hidden" id="editId">
                <div>
                    <label class="block text-sm font-medium mb-1">類型</label>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="border rounded-lg p-2 text-center cursor-pointer flex items-center justify-center space-x-2">
                            <input type="radio" name="type" value="expense" checked class="text-blue-600"> <span>支出</span>
                        </label>
                        <label class="border rounded-lg p-2 text-center cursor-pointer flex items-center justify-center space-x-2">
                            <input type="radio" name="type" value="income" class="text-blue-600"> <span>收入</span>
                        </label>
                    </div>
                </div>

                <!-- 分類選單 -->
                <div>
                    <label class="block text-sm font-medium mb-1">消費分類</label>
                    <select id="categoryInput" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-transparent">
                        <option value="食宿">🍔 食宿</option>
                        <option value="交通">🚗 交通</option>
                        <option value="娛樂">🎮 娛樂</option>
                        <option value="購物">🛍️ 購物</option>
                        <option value="其他">📌 其他</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-sm font-medium mb-1">日期</label>
                        <input type="date" id="date" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">金額</label>
                        <input type="number" id="amount" placeholder="0" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-transparent">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">項目名稱</label>
                    <input type="text" id="text" placeholder="例如：晚餐、捷運" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-transparent">
                </div>

                <div class="flex space-x-2">
                    <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-medium py-2.5 rounded-lg hover:bg-blue-700 transition shadow">新增紀錄</button>
                    <!-- 兩步驟重製按鈕 -->
                    <button type="button" id="resetStepBtn" class="bg-gray-300 hover:bg-gray-400 text-gray-700 text-sm px-3 py-2.5 rounded-lg transition">重製</button>
                </div>
                <button type="button" id="cancelBtn" onclick="resetForm()" class="w-full bg-gray-400 text-white font-medium py-2.5 rounded-lg hover:bg-gray-500 transition hidden mt-2">取消編輯</button>
            </form>

            <!-- 最近 3 筆消費 -->
            <div>
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-sm font-bold">最近消費 (最近3筆)</h3>
                </div>
                <div id="recentList" class="space-y-2 mb-4"></div>
                <button onclick="switchView('details')" class="w-full text-center text-blue-500 hover:text-blue-600 text-sm font-medium py-2 bg-blue-50 rounded-lg transition">
                    查看完整明細 ➔
                </button>
            </div>
        </div>

        <!-- ================= 頁面二：完整明細與分析頁 ================= -->
        <div id="detailsView" class="hidden">
            <button onclick="switchView('home')" class="mb-4 text-sm text-blue-500 hover:underline flex items-center">
                ⬅ 返回首頁
            </button>

            <!-- 三大子分頁切換按鈕 -->
            <div class="grid grid-cols-3 gap-1 bg-gray-200 p-1 rounded-xl mb-4 text-sm font-medium text-center">
                <button onclick="switchTab('overview')" id="tabBtnOverview" class="py-2 rounded-lg bg-white shadow text-blue-600">綜覽</button>
                <button onclick="switchTab('filter')" id="tabBtnFilter" class="py-2 rounded-lg text-gray-600">篩選/每月</button>
                <button onclick="switchTab('chart')" id="tabBtnChart" class="py-2 rounded-lg text-gray-600">圓餅圖</button>
            </div>

            <!-- 子分頁 1：綜覽 -->
            <div id="tabOverview" class="space-y-2 max-h-96 overflow-y-auto"></div>

            <!-- 子分頁 2：篩選與每月明細 -->
            <div id="tabFilter" class="hidden space-y-3">
                <div class="grid grid-cols-2 gap-2">
                    <input type="month" id="filterMonth" class="w-full px-3 py-2 border rounded-lg text-sm bg-transparent">
                    <select id="filterCategory" class="w-full px-3 py-2 border rounded-lg text-sm bg-transparent">
                        <option value="">全部分類</option>
                        <option value="食宿">🍔 食宿</option>
                        <option value="交通">🚗 交通</option>
                        <option value="娛樂">🎮 娛樂</option>
                        <option value="購物">🛍️ 購物</option>
                        <option value="其他">📌 其他</option>
                    </select>
                </div>

                <!-- 該月份小結面板 -->
                <div id="monthlySummaryPanel" class="bg-gray-50 border p-3 rounded-lg text-xs flex justify-around text-center">
                    <div><span class="text-gray-400 block">該月結餘</span><span id="mBalance" class="font-bold text-sm">$0</span></div>
                    <div><span class="text-gray-400 block">該月收入</span><span id="mIncome" class="font-bold text-green-500">$0</span></div>
                    <div><span class="text-gray-400 block">該月支出</span><span id="mExpense" class="font-bold text-red-500">$0</span></div>
                </div>

                <div id="filterList" class="space-y-2 max-h-72 overflow-y-auto"></div>
            </div>

            <!-- 子分頁 3：圓餅圖 -->
            <div id="tabChart" class="hidden flex flex-col items-center">
                <div class="w-64 h-64">
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>
        </div>

    </div>

    <!-- 主程式引入 -->
    <script type="module" src="script.js"></script>
</body>
</html>
